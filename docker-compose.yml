services:
  app:
    build:
      context: .
      target: app
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
    env_file:
      - .env
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  node:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - .:/app

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: house1
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
